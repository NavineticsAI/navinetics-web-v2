name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    # Not on every commit. Power Automate commits the review document to
    # main on each of Word's autosaves, and without this each one fires a
    # full Pages deploy and cancels the one in flight. Deploy when the SITE
    # changes; the copy workflow's own push touches src/ and is covered.
    paths-ignore:
      - 'copy/**'
      - 'documentation/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

# TWO JOBS, NOT ONE. Building and deploying in one job broke on 24 Nov
# 2026: upload-pages-artifact finalized the artifact and deploy-pages asked
# for it 0.3 s later, before GitHub's artifact listing showed it — "Found 0
# artifact(s)" — on the first run and again on a re-run, although the API
# listed it seconds afterwards. A separate deploy job starts only once the
# build job has finished, which is GitHub's own Pages template and gives the
# listing the time it needs.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Build Vite application
        run: npm run build

      # Gates on the failures that are invisible in dev and fatal in production:
      # a missing 404.html, assets that lost the base path, and public/ files
      # referenced at the server root. All three shipped once already.
      - name: Check build output
        run: npm run check:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
