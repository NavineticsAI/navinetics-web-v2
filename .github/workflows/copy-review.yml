name: Publish reviewed copy

# A reviewed Word document lands in copy/incoming/, and this puts it on the site.
#
# NOBODY WHO REVIEWS NEEDS THE CODE. Management has one thing: the shared Word
# document in OneDrive. They open it, turn on Track Changes, edit, and save.
# That is the whole interaction — there is no switch, no button and nothing to
# remember. Once a day this collects the document and publishes what changed.
#
# IT FETCHES; NOTHING PUSHES TO IT. Power Automate would need its HTTP action to
# reach GitHub, and that is a Premium licence — about £15 a month, forever, to
# move one file. Reading the document from OneDrive on a schedule costs nothing
# and changes nothing for the reviewers: same document, same folder, same Word.
# The trade is that a change goes out on the next run rather than at once, which
# for copy nobody is waiting on is not a trade at all.
#
# IT PUBLISHES DIRECTLY, WITH NOBODY IN THE LOOP. NaviNetics asked for that on
# 2026-09-03. At the time the site was served from github.io and was NOT
# connected to navinetics.com — a review URL, not public promotional material.
#
#   READ THIS AGAIN BEFORE THE DOMAIN IS CONNECTED. From that day a Word
#   document in a shared folder can change public claims about a 510(k)-cleared
#   medical device with nobody reading them first. That may still be the right
#   trade, but it is a different decision from the one made here, and it should
#   be taken deliberately rather than inherited.
#
# SO IT FAILS SAFE. It publishes only when ALL of these hold, and does nothing
# whatsoever otherwise:
#
#   the document has been left alone for hours (nobody is mid-sentence)
#   there is at least one real text change
#   NOTHING was refused — not one broken {1}, emptied cell or stale file
#   the site builds, lints and passes the deploy check
#   the change touches src/, the manifest and the archive only
#
# Any one failing stops the run with nothing pushed, and GitHub emails the
# repository owner. A mistake is always "nothing happened", never "the wrong
# thing is live".

on:
  schedule:
    # Twice a day. 06:00 UTC is around midnight in Rochester, so anything edited
    # during the afternoon is live by morning; 18:00 UTC is around noon there,
    # which catches the morning's work before the day ends. Neither run does
    # anything if the document was saved in the last few hours.
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      ignore_quiet_period:
        description: 'Publish even if the document was saved in the last few hours'
        type: boolean
        default: false
  push:
    paths: ['copy/incoming/*.docx']

permissions:
  contents: write
  # It deploys the site itself - see the note on the last steps.
  pages: write
  id-token: write

# Word autosaves to OneDrive every few seconds, so a reviewer working for twenty
# minutes can land a dozen commits here. A run still going when the next save
# arrives is working on stale text: cancel it and let the newer one win.
concurrency:
  group: copy-review
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install python-docx

      # Only on the schedule and on a manual run. A push already put the
      # document there, and fetching would overwrite it with whatever OneDrive
      # currently holds.
      - name: Collect the document from OneDrive
        if: github.event_name != 'push'
        env:
          # Either one link, or the four app-registration values. See the top of
          # tools/copy-fetch.mjs. The link is the one that needs no administrator.
          REVIEW_DOC_URL: ${{ secrets.REVIEW_DOC_URL }}
          # A scheduled run waits for the document to go quiet. Somebody
          # clicking Run workflow has decided it is ready, so let them say so.
          REVIEW_QUIET_HOURS: ${{ inputs.ignore_quiet_period && '0' || '4' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          REVIEW_DRIVE_USER: ${{ secrets.REVIEW_DRIVE_USER }}
        run: |
          set +e
          node tools/copy-fetch.mjs --out copy/incoming/review.docx
          code=$?
          # 2 means nothing to do: an empty folder, or the document was saved
          # too recently and somebody may still be working in it.
          if [ $code -eq 2 ]; then exit 0; fi
          exit $code

      - name: Find the document
        id: doc
        run: |
          # Word leaves a ~$<name> lock file beside an open document. It is not a
          # document, and it sorts late enough to be picked by accident.
          # NOT `ls -t`: actions/checkout writes every file in the same
          # millisecond, so with two documents the newest is a coin toss and
          # the loser stays in the repo, republishable by a manual run.
          shopt -s nullglob
          docs=(copy/incoming/*.docx)
          docs=("${docs[@]//*\/~\$*/}")
          n=${#docs[@]}
          if [ "$n" -eq 0 ]; then
            echo "No document in copy/incoming/ — nothing to do."
            echo "found=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$n" -gt 1 ]; then
            echo "::error::$n documents in copy/incoming/. Which one is meant is a guess, so nothing was published."
            printf '  %s\n' "${docs[@]}"
            exit 1
          fi
          f="${docs[0]}"
          echo "Using $f"
          echo "found=$f" >> "$GITHUB_OUTPUT"

      - name: Read the edits
        id: edits
        if: steps.doc.outputs.found != ''
        run: |
          python tools/copy-import.py "${{ steps.doc.outputs.found }}" --json copy/copy-changes.json
          n=$(node -e "process.stdout.write(String(require('./copy/copy-changes.json').changes.length))")
          go=$(node -e "process.stdout.write(String(require('./copy/copy-changes.json').publish))")
          bad=$(node -e "process.stdout.write(String((require('./copy/copy-changes.json').problems||[]).filter(p=>p.kind!=='row missing').length))")
          echo "count=$n"     >> "$GITHUB_OUTPUT"
          echo "publish=$go"  >> "$GITHUB_OUTPUT"
          echo "refused=$bad" >> "$GITHUB_OUTPUT"
          echo "$n text change(s); $bad edit(s) refused"

      # Normally a refused edit is reported and the rest proceeds. Not here.
      # With nobody reading the run, publishing four of a reviewer's five changes
      # and leaving the fifth in a log is how a half-made correction goes live —
      # a disclaimer edited but its qualifier lost. All or nothing.
      - name: Something was refused — stop
        if: steps.doc.outputs.found != '' && steps.edits.outputs.refused != '0'
        run: |
          echo "::error::${{ steps.edits.outputs.refused }} edit(s) could not be applied. Nothing was published."
          echo "The reasons are in 'Read the edits' above. Fix the document and save again."
          exit 1

      - name: Nothing changed
        if: steps.doc.outputs.found != '' && steps.edits.outputs.count == '0'
        run: echo "Asked to publish, but the document already matches the site."

      # Applying refuses on a stale manifest — if the copy changed while the
      # document was out, the recorded positions no longer point at the right
      # text and that file is skipped rather than written at the wrong offsets.
      - name: Apply the edits
        if: steps.doc.outputs.found != '' && steps.edits.outputs.count != '0'
        run: node tools/copy-apply.mjs --changes copy/copy-changes.json --apply --force

      - name: Prove the site still works
        if: steps.doc.outputs.found != '' && steps.edits.outputs.count != '0'
        run: |
          npm run lint
          npm run build
          npm run check:build

      # Without this the NEXT review is built against positions that have moved,
      # and every one of its edits is refused as "the file changed since export".
      # What this document said, so the NEXT one is compared against it rather
      # than against the export it was built from. Written only here, after the
      # edits have actually been applied - a dry run writing it would leave the
      # next real run seeing nothing to do.
      - name: Remember what this document said
        if: steps.doc.outputs.found != '' && steps.edits.outputs.count != '0'
        run: python tools/copy-import.py "${{ steps.doc.outputs.found }}" --json /tmp/ignore.json --snapshot copy/baselines/last.json --quiet

      - name: Re-record where every sentence now lives
        if: steps.doc.outputs.found != '' && steps.edits.outputs.count != '0'
        run: node tools/copy-export.mjs

      # The shared document is mutable, so the version that produced a given
      # publish cannot be recovered from it afterwards. Keeping a copy is the
      # only way to answer "what exactly went live on the third, and from what?".
      - name: Keep the document this came from
        if: steps.doc.outputs.found != '' && steps.edits.outputs.count != '0'
        run: |
          mkdir -p copy/published
          cp "${{ steps.doc.outputs.found }}" "copy/published/$(date -u +%Y-%m-%d_%H%M).docx"

      - name: Publish
        if: steps.doc.outputs.found != '' && steps.edits.outputs.count != '0'
        run: |
          # The document has been dealt with: take it out of incoming/ so a
          # manual re-run cannot publish the same round twice. --ignore-unmatch
          # because on a scheduled run the file was fetched rather than
          # committed, so git has never heard of it and plain `git rm` is a
          # fatal error at the very last step of an otherwise finished job.
          git rm -q --ignore-unmatch "${{ steps.doc.outputs.found }}"
          git add src copy/copy-manifest.json copy/published copy/baselines
          # src/, the manifest and the archive only. If anything else moved,
          # something is wrong with the run rather than with the copy, and it
          # must not reach the site.
          if ! git diff --cached --quiet -- ':!src' ':!copy/copy-manifest.json' ':!copy/published' ':!copy/incoming' ':!copy/baselines'; then
            echo "::error::Staged changes outside src/ — refusing to publish."
            git diff --cached --name-only
            exit 1
          fi
          git config user.name  "NaviNetics copy review"
          git config user.email "noreply@navinetics.com"
          git commit -m "Apply reviewed copy from the shared document

          ${{ steps.edits.outputs.count }} text change(s), published automatically
          after the switch on the document's cover was set to YES.

          Nothing here was written by the workflow: every change is a cell a
          reviewer edited in the Word document. The document it came from is
          kept in copy/published/."
          git push
          echo "Pushed."

      # AND DEPLOYS IT, rather than leaving that to the workflow watching main.
      # A push made by a workflow does not trigger other workflows - GitHub's
      # guard against a job setting itself off forever - so the copy commit
      # lands and nothing happens. The site is already built and checked two
      # steps up; this publishes that same build.
      - name: Configure GitHub Pages
        if: steps.doc.outputs.found != '' && steps.edits.outputs.count != '0'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: steps.doc.outputs.found != '' && steps.edits.outputs.count != '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: steps.doc.outputs.found != '' && steps.edits.outputs.count != '0'
        uses: actions/deploy-pages@v4
